<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="titlebar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000080"/>
      <stop offset="1" stop-color="#1084d0"/>
    </linearGradient>
  </defs>
  <g shape-rendering="crispEdges">
    <!-- Window frame: raised Win95 bevel -->
    <rect x="0" y="2" width="64" height="60" fill="#404040"/>
    <rect x="0" y="2" width="63" height="59" fill="#ffffff"/>
    <rect x="1" y="3" width="62" height="58" fill="#808080"/>
    <rect x="1" y="3" width="61" height="57" fill="#c0c0c0"/>
    <!-- Title bar -->
    <rect x="4" y="6" width="56" height="11" fill="url(#titlebar)"/>
    <rect x="7" y="9" width="3" height="3" fill="#ffffff"/>
    <rect x="12" y="10" width="16" height="2" fill="#b8cef0"/>
    <!-- Close button -->
    <rect x="50" y="8" width="8" height="8" fill="#c0c0c0"/>
    <rect x="50" y="8" width="8" height="1" fill="#ffffff"/>
    <rect x="50" y="8" width="1" height="8" fill="#ffffff"/>
    <rect x="50" y="15" width="8" height="1" fill="#404040"/>
    <rect x="57" y="8" width="1" height="8" fill="#404040"/>
    <!-- Client area: sunken -->
    <rect x="4" y="19" width="56" height="38" fill="#ffffff"/>
    <rect x="4" y="19" width="56" height="1" fill="#808080"/>
    <rect x="4" y="19" width="1" height="38" fill="#808080"/>
  </g>
  <!-- Close button X -->
  <path d="M52.2 10.2 L55.8 13.8 M55.8 10.2 L52.2 13.8" stroke="#000000" stroke-width="1.2" fill="none"/>
  <!-- Swap (repeat) glyph, as in the SwapServer plugin icon -->
  <g fill="#1a5fb4" shape-rendering="crispEdges">
    <rect x="18" y="30" width="18" height="4"/>
    <rect x="18" y="30" width="4" height="13"/>
    <polygon points="36,24 46,32 36,40" shape-rendering="auto"/>
    <rect x="28" y="42" width="18" height="4"/>
    <rect x="42" y="33" width="4" height="13"/>
    <polygon points="28,36 18,44 28,52" shape-rendering="auto"/>
  </g>
</svg>
